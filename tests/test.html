<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nineCat Regression Tests</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#171D26;color:#EEF3F9;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  main{max-width:820px;margin:48px auto;padding:0 24px}
  h1{margin:0 0 6px;font-size:28px}
  .sub{color:#A6B3C3;margin-bottom:24px}
  #summary{padding:14px 16px;border:1px solid #36434F;background:#202834;margin-bottom:14px}
  .test{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid #2A3441}
  .test.pass .mark{color:#5CC489}.test.fail .mark{color:#E4636E}
  .mark{width:20px;font-weight:700}.name{flex:1}.detail{color:#A6B3C3;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
  .fail .detail{color:#F2B3B9}
  button{margin-top:18px;background:#D4A059;color:#171D26;border:0;padding:9px 14px;font-weight:700;cursor:pointer}
  iframe{position:fixed;left:-10000px;top:-10000px;width:1440px;height:900px;border:0}
</style>
</head>
<body>
<main>
  <h1>nineCat Regression Tests</h1>
  <div class="sub">Characterization tests against the real <code>index.html</code>. These are our safety net while refactoring.</div>
  <div id="summary">Loading nineCat…</div>
  <div id="results"></div>
  <button id="rerun" type="button">Run again</button>
</main>
<iframe id="app" aria-hidden="true"></iframe>
<script src="tests.js?v=yahoo-20261018"></script>
